[package]
name = "winnote"
version = "0.1.0"
edition = "2021"
description = "WinNote : éditeur de texte natif Windows 64 bits, léger (Bloc-notes + Notepad++)"

[dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader",
  "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_Ole",
] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
