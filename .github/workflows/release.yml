name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tests unitaires
        run: cargo test --release
      - name: Compilation
        run: cargo build --release
      - name: Autotest integre
        shell: pwsh
        run: |
          $p = Start-Process target\release\winnote.exe -ArgumentList '--selftest','selftest.log' -PassThru
          if (-not $p.WaitForExit(120000) -or $p.ExitCode -ne 0) { Get-Content selftest.log; exit 1 }
      - name: Empreinte
        shell: pwsh
        run: |
          $h = (Get-FileHash target\release\winnote.exe -Algorithm SHA256).Hash.ToLower()
          "$h *winnote.exe" | Set-Content target\release\winnote.exe.sha256 -Encoding ascii
      - name: Publier
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" target\release\winnote.exe target\release\winnote.exe.sha256 --title "WinNote ${{ github.ref_name }}" --generate-notes
